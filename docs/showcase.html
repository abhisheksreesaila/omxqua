    ${row("Field · error", `<div class="field" style="width:100%;max-width:260px"><label>Email</label><div class="input is-err"><input value="maya@"></div><span class="err">Missing its domain</span></div>`,
      `<div style="width:100%"><label class="mf err"><input placeholder=" " value="maya@"><span class="fl">Email</span><i class="ul"></i></label><div class="mf-help err">Missing its domain, like maya@example.com</div></div>`,
      `<span class="fit">Fits.</span> The label turns red with the line, so the error is seen where you're looking. Keep the sentence below.`)}
    ${row("Button press", `<button class="btn fill">Squash</button>`,
      `<button class="btn fill rp nosquash" data-rp>Ripple</button><button class="btn tonal rp" data-rp>Both</button>`,
      `<b>Decided: squash.</b> No ripple anywhere.`)}
    ${row("List row", `<div class="runs" style="padding:0;width:100%"><li style="list-style:none" class="row-demo">Release wheels<span class="badge ok" style="margin-left:auto"><i></i>passed</span></li></div>`,
      `<div style="width:100%"><div class="rp row-demo" data-rp style="position:relative;display:flex;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer">Release wheels<span class="badge ok" style="margin-left:auto"><i></i>passed</span></div></div>`,
      `<b>Decided: as is</b> (state-layer tint + a small squash).`)}
  </div>
  <div class="src note">halo, fill and drawn tick ≤ 250 ms · labels float in 200 ms · nothing bounces</div>
  </main>`;
}

function kit() {
  const fam = { dev: "Developer", travel: "Travel", kids: "Kids" }[state.fam] + " · " + SKINS[state.fam].find(o => o[0] === state.skin)[1];
  return `${status}<main class="main">
  <div class="ph"><div><h1>Kit</h1><div class="sub">${fam} · ${state.theme === "night" ? "Night" : "Light"} · every control, every state</div></div></div>
  <div class="kit">
    <section class="card"><div class="card-h"><h3>Buttons</h3></div><div class="card-b">
      <div class="wrap-row"><button class="btn fill">${ic("check")}Publish</button><button class="btn tonal">Preview</button><button class="btn text">Cancel</button></div>
      <div class="wrap-row"><button class="btn danger">Delete release</button><button class="btn tonal icon" data-tip="Search|⌘K">${ic("search")}</button><button class="btn tonal icon" data-tip="More">${ic("more")}</button><button class="btn fill" disabled>Disabled</button></div>
      <div class="wrap-row"><button class="btn fill sm">Small</button><button class="btn fill">Default</button><button class="btn fill lg">Large</button></div>
    </div><div class="src note">one filled button per card · verbs, not "Submit"</div></section>

    <section class="card"><div class="card-h"><h3>Fields</h3></div><div class="card-b">
      <div><label class="mo"><input placeholder=" " value="omxcore"><span class="fl">Package name</span></label><div class="mf-help">Lowercase, used in pip install</div></div>
      <label class="mo has-lead"><span class="lead">${ic("search")}</span><input placeholder=" "><span class="fl">Search everything</span><kbd>⌘K</kbd></label>
      <div><label class="mo err"><input placeholder=" " value="maya@"><span class="fl">Email</span></label><div class="mf-help err">That email is missing its domain, like maya@example.com</div></div>
      <button class="mo sel" data-menu style="font:inherit;color:inherit;text-align:left;border:0"><span class="fl">Python</span><span class="val">3.11 and newer</span><span class="chev">${ic("down")}</span></button>
    </div><div class="src note">label floats into the border · help below · errors as a sentence</div></section>

    <section class="card"><div class="card-h"><h3>Choices</h3></div><div class="card-b">
      <div class="row-ctl"><button class="switch on" data-toggle></button>Email me on release</div>
      <div class="row-ctl"><button class="switch" data-toggle></button>Pre-releases in feed</div>
      <div class="row-ctl"><button class="check on" data-toggle></button>Linux<button class="check on" data-toggle></button>macOS<button class="check" data-toggle></button>Windows</div>
      <div class="row-ctl"><button class="radio on" data-radio></button>Public<button class="radio" data-radio></button>Private</div>
      ${seg(["Day", "Week", "Month"], "Week")}
      <input type="range" class="slider" value="40" data-slider>
    </div><div class="src note">thumbs and toggles slide on a spring</div></section>

    <section class="card"><div class="card-h"><h3>Chips, badges, tabs</h3></div><div class="card-b">
      <div class="wrap-row"><button class="chip on">All</button><button class="chip">Stable</button><button class="chip">linux <span class="x">${ic("x", 'style="width:12px;height:12px"')}</span></button><button class="chip">${ic("plus", 'style="width:13px;height:13px"')}Filter</button></div>
      <div class="wrap-row"><span class="badge ok"><i></i>passed</span><span class="badge warn"><i></i>running</span><span class="badge bad"><i></i>failed</span><span class="badge info"><i></i>new</span><span class="badge">v0.2.0</span></div>
      ${tabs(["Overview", "Releases", "Settings"], "Overview")}
    </div><div class="src note">pill = tappable · square mono badge = status</div></section>

    <section class="card"><div class="card-h"><h3>Progress and loading</h3></div><div class="card-b">
      <div class="prog"><i style="width:64%"></i></div>
      <div class="prog indet"><i></i></div>
      <div style="display:flex;flex-direction:column;gap:8px"><div class="skel" style="width:70%"></div><div class="skel" style="width:90%"></div><div class="skel" style="width:50%"></div></div>
    </div><div class="src note">loading = skeleton rows, never zeros</div></section>

    <section class="card"><div class="card-h"><h3>Overlays</h3></div><div class="card-b">
      <div class="wrap-row"><button class="btn tonal" data-menu>${ic("down")}Menu</button><button class="btn tonal" data-dialog>Dialog</button><button class="btn tonal" data-sheet>Sheet</button><button class="btn tonal" data-toast="Release 0.3.0 published">Toast</button></div>
      <div class="empty"><div class="ring">${ic("box")}</div><b>No releases yet</b>Publish your first version to see it here.<div style="margin-top:12px"><button class="btn fill sm">${ic("tag")}Publish</button></div></div>
    </div><div class="src note">menus ease in 220 ms · panels settle · nothing bounces</div></section>

    <section class="card"><div class="card-h"><h3>Table</h3></div>
      <table class="tbl"><thead><tr><th>Name</th><th>Owner</th><th class="num">Size</th></tr></thead><tbody>
      <tr><td>wheels-linux</td><td class="ink2">ci</td><td class="num">4.1 MB</td></tr><tr><td>wheels-macos</td><td class="ink2">ci</td><td class="num">3.8 MB</td></tr><tr><td>sdist</td><td class="ink2">abhishek</td><td class="num">0.9 MB</td></tr></tbody></table>
      <div class="src note">hairline rows · mono numbers right-aligned</div></section>

    <section class="card"><div class="card-h"><h3>Colour</h3><span class="sp"></span><span class="badge">${fam.split(" · ")[1]}</span></div><div class="card-b">
      <div class="surfs">${[0, 1, 2, 3].map(i => `<div style="background:var(--oq-surface-${i});box-shadow:var(--oq-shadow-${Math.min(i, 3) || 1})">s${i}</div>`).join("")}</div>
      <div class="swatches">${[1, 2, 3, 4, 5, 6].map(i => `<div><i style="background:var(--oq-data-${i})"></i><span>data-${i}</span></div>`).join("")}</div>
      <div class="wrap-row"><span class="badge" style="background:var(--oq-accent);color:var(--oq-on-accent);border:0">accent</span><span class="badge ok"><i></i>ok</span><span class="badge warn"><i></i>warn</span><span class="badge bad"><i></i>bad</span><span class="badge info"><i></i>info</span></div>
    </div><div class="src note">accent = one loud button + focus · data = series and kinds</div></section>
  </div></main>`;
}

/* =========================== Beacon (live activity) =========================== */
const ring = p => `<svg class="ring" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#3f3f46" stroke-width="2.5"/><circle cx="10" cy="10" r="8" fill="none" stroke="var(--oq-beacon-accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${(p * 50.3).toFixed(1)} 60" transform="rotate(-90 10 10)" data-ring/></svg>`;
function beacon() {
  if (state.fam === "dev") return `<div class="beacon" id="beacon"><div class="bc-compact">${ring(.6)}Release wheels<span class="mono" data-bstep>3/5</span></div>
    <div class="bc-open"><button class="x" data-bclose>${ic("x")}</button><h4>${ic("box")}Release wheels · 0.3.0rc1</h4><div class="sub2">a3f9c21 · started 2 min ago</div>
    <ul class="steps"><li><i class="d ok"></i>Build sdist<span>0:21</span></li><li><i class="d ok"></i>Wheels · linux<span>1:04</span></li><li><i class="d ok"></i>Wheels · macOS<span>1:12</span></li><li><i class="d run"></i>Wheels · windows<span data-btime>0:38</span></li><li><i class="d"></i>Upload to PyPI<span>queued</span></li></ul>
    <div class="bar2"><i style="width:60%" data-bbar></i></div><div class="bacts"><button class="bbtn pri">View run</button><button class="bbtn">Cancel</button></div></div></div>`;
  if (state.fam === "travel") return `<div class="beacon" id="beacon"><div class="bc-compact"><span class="live"></span>${ic("plane")}TAP 1352<span class="mono">boards <b data-bmin>42</b> min</span></div>
    <div class="bc-open"><button class="x" data-bclose>${ic("x")}</button><h4>${ic("plane")}JFK → LIS · TAP 1352</h4><div class="sub2">Gate B12 · Seat 14C · Group 3</div>
    <div class="big"><span data-bmin2>42</span> min</div><div class="sub2">until boarding at 20:15 · on time</div>
    <div class="bar2"><i style="width:30%" data-bbar></i></div><div class="bacts"><button class="bbtn pri">Boarding pass</button><button class="bbtn">Directions to gate</button></div></div></div>`;
  return `<div class="beacon" id="beacon"><div class="bc-compact"><span class="live"></span>${ic("book")}Reading<span class="mono" data-btimer>12:04</span></div>
    <div class="bc-open"><button class="x" data-bclose>${ic("x")}</button><h4>${ic("book")}Reading · Matilda</h4><div class="sub2">quest: read 20 minutes</div>
    <div class="big" data-btimer2>12:04</div><div class="bar2"><i style="width:40%" data-bbar></i></div><div class="bacts"><button class="bbtn pri" data-bpause>Pause</button><button class="bbtn">+5 min</button><button class="bbtn">I finished!</button></div></div></div>`;
}

/* =========================== shared overlays =========================== */
const overlays = `
  <div class="menu" id="menu" hidden><div class="lab">Release</div><button class="mi">${ic("copy")}Copy install command<kbd>⌘C</kbd></button><button class="mi">${ic("book")}Open docs</button><button class="mi">${ic("git")}View on GitHub<kbd>↗</kbd></button><hr><button class="mi danger">${ic("x")}Yank 0.1.4</button></div>
  <div class="toast" id="toast" hidden><span id="toastMsg"></span><button class="btn text sm" id="toastUndo">Undo</button></div>
  <div class="scrim" id="scrim" hidden><div class="dialog" style="position:relative"><button class="xbtn" data-close style="position:absolute;top:14px;right:14px" aria-label="Close">${ic("x")}</button><h3 style="padding-right:44px">Publish 0.3.0?</h3><p>Wheels for linux, macOS and Windows go to PyPI. You can yank a release, but you can't reuse its version number.</p><div class="acts"><button class="btn text" data-close>Cancel</button><button class="btn fill" data-close data-toast2="0.3.0 is on PyPI">Publish 0.3.0</button></div></div></div>
  <div class="sheet" id="sheet" hidden><div class="grab"></div><div style="display:flex;align-items:center;justify-content:space-between;margin:0 0 14px"><h3 style="margin:0;font-size:1.2em">Add to Friday</h3><button class="xbtn" data-close aria-label="Close">${ic("x")}</button></div>
    <div style="display:flex;flex-direction:column;gap:14px"><label class="mo"><input placeholder=" "><span class="fl">What · dinner, museum, train</span></label>
    <div class="field"><label>Kind</label>${seg(["See", "Food", "Stay", "Travel"], "See")}</div>
    <label class="mo"><input placeholder=" " value="19:30"><span class="fl">Time</span></label>
    <button class="btn fill lg" data-close data-toast2="Added to Friday">${ic("plus")}Add to Friday</button></div></div>
  <div class="tip" id="tip" hidden></div>`;

/* =========================== render + motion =========================== */
/* wrap sidebar label text so the collapsed island can drop it cleanly */
function wrapLabels() { $$(".side .nav", root).forEach(b => [...b.childNodes].forEach(n => { if (n.nodeType === 3 && n.textContent.trim()) { const sp = document.createElement("span"); sp.className = "lbl"; sp.textContent = n.textContent; n.replaceWith(sp); } })); }
/* top nav: order = 4 visible (the 4th is the active extra if one is picked) · +N · the rest */
/* the reusable motion lives in ../src/omxqua.js (window.Omxqua); these bind it to this page's root */
const { placeThumb, settle, gentleIn, gentleOut, sizeBeacon } = Omxqua;
const layoutTopnav = animate => Omxqua.layoutTopnav($("#topnav", root), animate);
const navOpen = on => Omxqua.openTopnav($("#topnav", root), on);
const navLater = () => Omxqua.foldTopnavLater($("#topnav", root));
const toast = msg => Omxqua.toast($("#toast", root), msg, $("#toastMsg", root));
root.addEventListener("pointerover", e => { const n = e.target.closest("#topnav"); if (n) Omxqua.holdTopnav(n); });
root.addEventListener("pointerout", e => { const n = e.target.closest("#topnav"); if (n && !n.contains(e.relatedTarget) && n.classList.contains("open")) navLater(); });


function render(animate) {
  skinSeg(); root.className = `oq-root oq-${state.theme} oq-family-${state.fam} oq-skin-${state.skin} screen`;
  const body = state.view === "touch" ? touch() : state.view === "kit" ? kit() : { dev: devApp, travel: travelApp, kids: kidsApp }[state.fam]();
  root.innerHTML = body + overlays + (state.view === "app" ? beacon() : "");
  root.classList.toggle("oq-islands", state.shell === "islands"); root.classList.toggle("oq-top", state.shell === "top"); root.classList.toggle("oq-dock", state.shell === "dock");
  if (state.view === "app") root.insertAdjacentHTML("beforeend", topnav(NAV[state.fam]));
  wrapLabels(); layoutTopnav(false);
  if (state.view === "app") root.insertAdjacentHTML("beforeend", `<div class="brand-isl"><span class="mark">${BRAND[state.fam][0] ?? ic("plane")}</span>${BRAND[state.fam][1]}</div>`);
  const bk = $("#beacon", root); if (bk) requestAnimationFrame(() => sizeBeacon(bk, false));
  requestAnimationFrame(() => { $$(".seg2, .tabs, .tabbar", root).forEach(placeThumb); });
  if (animate) settle($(".main", root));
}

root.addEventListener("click", e => {
  const t = e.target;
  const mt = t.closest("[data-mt]"); if (mt) { mt.classList.toggle("on"); const h = mt.closest(".mh"); if (h && mt.classList.contains("on") && !reduce) { h.classList.remove("pulse"); h.offsetWidth; h.classList.add("pulse"); } return; }
  const mr = t.closest("[data-mr]"); if (mr) { $$("[data-mr]", root).forEach(x => x.classList.toggle("on", x === mr)); const h = mr.closest(".mh"); if (h && !reduce) { h.classList.remove("pulse"); h.offsetWidth; h.classList.add("pulse"); } return; }
  if (t.closest("[data-more]")) { navOpen(true); return; }
  const tn = t.closest("#topnav button[data-i]"); if (tn) { $$("#topnav button[data-i]", root).forEach(x => x.classList.toggle("on", x === tn)); placeThumb(tn.parentElement); if ($("#topnav", root).classList.contains("open")) navLater(); else layoutTopnav(true); return; }
  if (t.closest("[data-pin]")) { t.closest(".side").classList.toggle("pinned"); return; }
  const bk = t.closest("#beacon");
  if (t.closest("[data-bclose]")) { bk.classList.remove("open"); sizeBeacon(bk, true); return; }
  if (t.closest("[data-bpause]")) { paused = !paused; t.closest("[data-bpause]").textContent = paused ? "Resume" : "Pause"; return; }
  if (bk && !bk.classList.contains("open")) { bk.classList.add("open"); sizeBeacon(bk, true); return; }
  if (!bk) { const ob = $("#beacon.open", root); if (ob) { ob.classList.remove("open"); sizeBeacon(ob, true); } }
  const sb = t.closest(".seg2 button, .tabs button"); if (sb) { const g = sb.parentElement; $$("button", g).forEach(x => x.classList.toggle("on", x === sb)); placeThumb(g); }
  const nav = t.closest(".nav"); if (nav) { $$(".nav", root).forEach(x => x.classList.toggle("on", x === nav)); }
  const day = t.closest(".day"); if (day) { $$(".day", root).forEach(x => x.classList.toggle("on", x === day)); }
  const tb = t.closest(".tabbar button"); if (tb) { $$(".tabbar button", root).forEach(x => x.classList.toggle("on", x === tb)); placeThumb(tb.parentElement); }
  const chip = t.closest(".chip"); if (chip && !t.closest(".x")) chip.classList.toggle("on");
  if (t.closest("[data-toggle]")) t.closest("[data-toggle]").classList.toggle("on");
  if (t.closest("[data-radio]")) { const r = t.closest("[data-radio]"); $$("[data-radio]", r.parentElement).forEach(x => x.classList.toggle("on", x === r)); }
  if (t.closest("[data-quest]")) { const q = t.closest("[data-quest]"); q.classList.toggle("done"); if (q.classList.contains("done")) toast("Great job! +1 star"); }
  const menuBtn = t.closest("[data-menu]"), menu = $("#menu", root);
  if (menuBtn) { e.stopPropagation(); const r = menuBtn.getBoundingClientRect(), b = root.getBoundingClientRect(); menu.style.left = Math.min(r.left - b.left, b.width - 240) + "px"; menu.style.top = (r.bottom - b.top + 6) + "px"; menu.hidden ? gentleIn(menu) : gentleOut(menu); return; }
  if (!t.closest("#menu")) gentleOut(menu); else if (t.closest(".mi")) { gentleOut(menu); toast(t.closest(".mi").textContent.trim().replace(/⌘C|↗/, "").trim()); }
  if (t.closest("[data-dialog]")) { const s = $("#scrim", root); s.hidden = false; if (!reduce) { s.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 }); $(".dialog", s).animate([{ opacity: 0, transform: "translateY(8px) scale(.98)" }, { opacity: 1, transform: "none" }], { duration: 260, easing: "cubic-bezier(.2,0,0,1)" }); } }
  if (t.closest("[data-sheet]")) { const s = $("#scrim", root), sh = $("#sheet", root); $(".dialog", s).style.display = "none"; s.hidden = false; sh.hidden = false; requestAnimationFrame(() => $$(".seg2", sh).forEach(placeThumb)); if (!reduce) { s.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 }); sh.animate([{ transform: "translateY(40px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 320, easing: "cubic-bezier(.2,0,0,1)" }); } }
  if (t.closest("[data-close]") || t.id === "scrim") { const s = $("#scrim", root), sh = $("#sheet", root); gentleOut(s); gentleOut(sh); setTimeout(() => { $(".dialog", s).style.display = ""; }, 160); const m = t.closest("[data-toast2]"); if (m) toast(m.dataset.toast2); }
  const tst = t.closest("[data-toast]"); if (tst) toast(tst.dataset.toast);
  if (t.id === "toastUndo") gentleOut($("#toast", root));
});
let paused = false, tick = 0;
setInterval(() => {
  tick++; const b = $("#beacon", root); if (!b) return;
  if (state.fam === "kids" && !paused) { const left = Math.max(0, 724 - tick), m = String(Math.floor(left / 60)).padStart(2, "0"), sec = String(left % 60).padStart(2, "0");
    $$("[data-btimer],[data-btimer2]", b).forEach(x => x.textContent = `${m}:${sec}`); const bar = $("[data-bbar]", b); if (bar) bar.style.width = (40 + tick / 12) + "%"; }
  if (state.fam === "dev") { const s2 = 38 + tick, el = $("[data-btime]", b); if (el) el.textContent = `0:${String(s2 % 60).padStart(2, "0")}`; }
  if (state.fam === "travel" && tick % 6 === 0) { const mins = Math.max(0, 42 - tick / 6); $$("[data-bmin],[data-bmin2]", b).forEach(x => x.textContent = mins); }
}, 1000);
root.addEventListener("pointerdown", e => {
  const mf = e.target.closest(".mf"); if (mf) { const r = mf.getBoundingClientRect(); $(".ul", mf).style.transformOrigin = `${e.clientX - r.left}px 50%`; }
  const rp = e.target.closest("[data-rp]"); if (rp && !reduce) { const r = rp.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, sp = document.createElement("span");
    sp.className = "ripple"; Object.assign(sp.style, { width: d + "px", height: d + "px", left: e.clientX - r.left - d / 2 + "px", top: e.clientY - r.top - d / 2 + "px" }); rp.appendChild(sp); setTimeout(() => sp.remove(), 600); }
});
root.addEventListener("input", e => { if (e.target.matches("[data-slider]")) e.target.style.setProperty("--v", e.target.value + "%"); });
root.addEventListener("mouseover", e => { const b = e.target.closest("[data-tip]"), tip = $("#tip", root); if (!b) return; const [a, k] = b.dataset.tip.split("|"); tip.innerHTML = a + (k ? `<kbd>${k}</kbd>` : ""); const r = b.getBoundingClientRect(), o = root.getBoundingClientRect(); tip.style.left = (r.left - o.left) + "px"; tip.style.top = (r.bottom - o.top + 6) + "px"; gentleIn(tip); });
root.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) gentleOut($("#tip", root)); });

const bind = (id, key, data) => $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; $$(id + " button").forEach(x => x.classList.toggle("on", x === b)); state[key] = b.dataset[data];
  if (key === "size") { $("#stage").classList.toggle("phone", state.size === "phone"); setTimeout(() => { $$(".seg2, .tabs, .tabbar", root).forEach(placeThumb); layoutTopnav(false); }, 420); }
  else render(true); });
bind("#famSeg", "fam", "f"); bind("#shellSeg", "shell", "h");
document.getElementById("skinSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.skin = b.dataset.k; render(true); }); bind("#viewSeg", "view", "v"); bind("#themeSeg", "theme", "t"); bind("#sizeSeg", "size", "s");
const q = new URLSearchParams(location.search);
if (q.get("bare")) document.body.classList.add("bare");
if (q.get("skin")) state.skin = q.get("skin");
for (const [k, sel, d] of [["shell", "#shellSeg", "h"], ["fam", "#famSeg", "f"], ["view", "#viewSeg", "v"], ["theme", "#themeSeg", "t"], ["size", "#sizeSeg", "s"]]) if (q.get(k)) { state[k] = q.get(k); $$(sel + " button").forEach(x => x.classList.toggle("on", x.dataset[d] === state[k])); }
$("#stage").classList.toggle("phone", state.size === "phone");
render(false);
})();
</script>
