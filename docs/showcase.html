/* ---------- showcase chrome: neutral, never themed (only the frames change with the theme) ---------- */
:root { --sc-bg: #ececea; --sc-ink: #18181b; --sc-ink2: #63636b; --sc-line: #d9d9d5; --sc-card: #ffffff; --sc-on: #18181b; --sc-on-ink: #ffffff; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body.bare .sc-bar { display: none; } body.bare { overflow: hidden; }
body { background: var(--background, var(--sc-bg)); color: var(--foreground, var(--sc-ink)); font: 14px/1.4 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.sc-bar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 18px; background: var(--background, var(--sc-bg)); border-bottom: 1px solid var(--border, var(--sc-line)); }
.sc-bar h1 { font: 650 15px "Geist", sans-serif; margin: 0; letter-spacing: -.01em; }
.sc-bar h1 span { color: var(--muted-foreground, var(--sc-ink2)); font-weight: 500; }
.sc-sp { flex: 1; }
.sc-grp { display: flex; align-items: center; gap: 8px; }
.sc-grp > b { font: 500 11px "Geist Mono", monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-foreground, var(--sc-ink2)); }
.sc-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--card, var(--sc-card)); box-shadow: inset 0 0 0 1px var(--border, var(--sc-line)); }
.sc-seg button { border: 0; background: none; font: 550 13px "Geist", sans-serif; color: var(--muted-foreground, var(--sc-ink2)); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.sc-seg button.on { background: var(--foreground, var(--sc-on)); color: var(--background, var(--sc-on-ink)); }
.sc-sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; }
/* option A: rail + stage */
.sc-a { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 60px); }
.sc-rail { padding: 16px 10px; border-right: 1px solid var(--border, var(--sc-line)); position: sticky; top: 58px; align-self: start; max-height: calc(100vh - 60px); overflow: auto; }
.sc-rail h4 { margin: 14px 10px 6px; font: 500 11px "Geist Mono", monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-foreground, var(--sc-ink2)); }
.sc-rail button { display: block; width: 100%; text-align: left; border: 0; background: none; font: 500 14px "Geist", sans-serif; color: inherit; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.sc-rail button.on { background: var(--card, var(--sc-card)); box-shadow: 0 0 0 1px var(--border, var(--sc-line)); font-weight: 650; }
.sc-stage { padding: 18px 22px 40px; }
.sc-pair { display: flex; gap: 22px; align-items: flex-start; }
.sc-note { color: var(--muted-foreground, var(--sc-ink2)); margin: 0 0 14px; max-width: 900px; }
.sc-note b { color: var(--foreground, var(--sc-ink)); }
/* option B: storyboard */
.sc-b { padding: 18px 22px 60px; display: flex; flex-direction: column; gap: 34px; }
.sc-jump { display: flex; flex-wrap: wrap; gap: 6px; }
.sc-jump a { font: 500 12.5px "Geist", sans-serif; color: inherit; text-decoration: none; padding: 5px 11px; border-radius: 999px; background: var(--card, var(--sc-card)); box-shadow: inset 0 0 0 1px var(--border, var(--sc-line)); }
.sc-row h2 { font: 650 17px "Geist", sans-serif; margin: 0 0 4px; letter-spacing: -.01em; }
.sc-row p { margin: 0 0 12px; color: var(--muted-foreground, var(--sc-ink2)); }
/* frames */
figure.fr { margin: 0; flex: none; }
figure.fr figcaption { font: 500 11.5px "Geist Mono", monospace; color: var(--muted-foreground, var(--sc-ink2)); margin: 0 0 7px; letter-spacing: .02em; }
.fr-clip { overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 12px 30px rgba(0,0,0,.10); }
.fr.phone .fr-clip { box-shadow: 0 0 0 7px #0d0d0f, 0 0 0 8px #3a3a3f, 0 18px 40px rgba(0,0,0,.18); }
.fr-scale { transform-origin: 0 0; }
.cx-screen { display: flex; flex-direction: column; container-type: inline-size; position: relative; overflow: hidden; contain: layout; background: var(--oq-surface-0); color: var(--oq-ink); }
.cx-screen > .shell { flex: 1; min-height: 0; }
.cx-screen .main { height: 100%; box-sizing: border-box; }
.cx-status { flex: none; height: 46px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px; font: 650 15px var(--oq-font); }
/* table page */
.sc-t { padding: 18px 22px 60px; }
.sc-t table { border-collapse: separate; border-spacing: 0 14px; width: 100%; }
.sc-t th { text-align: left; font: 500 11px "Geist Mono", monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-foreground, var(--sc-ink2)); padding: 0 12px; }
.sc-t td { vertical-align: top; padding: 0 12px; }
.sc-t td:first-child { width: 190px; }
.sc-t td:first-child b { display: block; font: 650 15px "Geist", sans-serif; }
.sc-t td:first-child span { display: block; color: var(--muted-foreground, var(--sc-ink2)); font-size: 13px; margin-top: 4px; line-height: 1.45; }
.cx-cell { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
/* ---------- Contoso: app-level layout (the app's own CSS, built from tokens) ---------- */
.cx-si { margin: auto; width: min(400px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 14px; padding: 24px 0; }
.cx-si .brandrow { display: flex; align-items: center; gap: 10px; font: 650 18px var(--oq-font-display); letter-spacing: -.02em; }
.cx-si h1 { margin: 10px 0 0; font: 700 calc(var(--oq-title, 28px) * .95) / 1.1 var(--oq-font-display); letter-spacing: -.03em; }
.cx-si .sub { color: var(--oq-ink-2); margin-top: -6px; }
.cx-si .btn { width: 100%; justify-content: center; }
.cx-si .rowsp { display: flex; align-items: center; justify-content: space-between; white-space: nowrap; }
.cx-or { display: flex; align-items: center; gap: 10px; color: var(--oq-ink-2); font-size: .85em; } .cx-or::before, .cx-or::after { content: ""; flex: 1; border-top: 1px solid var(--oq-line); }
.cx-next { background: var(--oq-ink); color: var(--oq-surface-0); border-radius: var(--oq-radius-card); box-shadow: var(--oq-shadow-2); padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.cx-next .k { font: 500 12px var(--oq-font-mono); opacity: .7; text-transform: uppercase; letter-spacing: .08em; }
.cx-next .t { font: 700 calc(var(--oq-title, 28px) * 1.25) / 1 var(--oq-font-display); letter-spacing: -.03em; }
.cx-next .m { opacity: .75; }
.cx-next .prog { background: color-mix(in srgb, var(--oq-surface-0) 22%, transparent); }
.cx-next .prog > i { background: var(--oq-surface-0); }
.cx-next .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cx-avs { display: flex; } .cx-avs .avatar { box-shadow: 0 0 0 2px var(--oq-ink); margin-left: -6px; } .cx-avs .avatar:first-child { margin-left: 0; }
.cx-it { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--oq-line-2); }
.cx-it:first-child { border-top: 0; }
.cx-it .t { font: 500 .85em var(--oq-font-mono); color: var(--oq-ink-2); }
.cx-it b { display: block; font-weight: 600; } .cx-it span { color: var(--oq-ink-2); font-size: .9em; }
.cx-res { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--oq-line-2); }
.cx-res:first-child { border-top: 0; }
.cx-res b { display: block; } .cx-res span { color: var(--oq-ink-2); font-size: .9em; }
.cx-acct { display: flex; align-items: center; gap: 14px; } .cx-acct .avatar { width: 48px; height: 48px; font-size: 16px; } .cx-acct b { display: block; font-size: 1.05em; } .cx-acct span { color: var(--oq-ink-2); }
.cx-form { display: flex; flex-direction: column; gap: 16px; max-width: 560px; }
.cx-form .mo { max-width: none; }
.cx-lab { font-size: .85em; color: var(--oq-ink-2); margin: 0 0 6px; }
.cx-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--oq-line-2); }
@container (max-width: 640px) { .cx-foot .btn { flex: 1; justify-content: center; } }

.beacon .ag-ring { flex: none; transform: rotate(-90deg); } .beacon .ag-ring circle { fill: none; stroke-width: 2.6; } .beacon .ag-ring .bg { stroke: #3f3f46; } .beacon .ag-ring .fg { stroke: var(--oq-beacon-accent); stroke-linecap: round; transition: stroke-dashoffset .6s linear; }

.beacon .ag-note { font: 12px var(--oq-font-mono); color: #a1a1aa; margin-top: 10px; }
.beacon .ag-diff { margin-top: 12px; display: grid; gap: 2px; font-size: 13px; }
.beacon .ag-diff div { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid #27272a; } .beacon .ag-diff div:first-child { border-top: 0; }
.beacon .ag-diff s { font: 12px var(--oq-font-mono); color: #a1a1aa; } .beacon .ag-diff b { font: 600 12.5px var(--oq-font-mono); color: var(--oq-beacon-accent); }

.beacon .ag-task b { display: block; font-weight: 600; } .beacon .ag-task span { color: #a1a1aa; font-size: 12px; } .beacon .ag-task .mono { font: 12px var(--oq-font-mono); color: #d4d4d8; }
.cx-draft { background: color-mix(in srgb, var(--oq-accent) 8%, transparent); border-radius: 10px; margin: 0 -10px; padding: 10px; border-top-color: transparent !important; }
.cx-draft .skel { height: 10px; margin-top: 6px; }
.cx-by { display: flex; align-items: center; gap: 5px; font: 500 .78em var(--oq-font-mono); color: var(--oq-ink-2); margin-top: 3px; } .cx-by .ico { width: 13px; height: 13px; color: var(--oq-accent); }

@container (max-width: 640px) { .cx-ask .btn.fill { flex: 1; justify-content: center; } }
.cx-task { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--oq-line-2); } .cx-task:first-child { border-top: 0; }

</style>

/* ---------- card titles carry a coloured icon tile (.ic-tile, 2026-10-24) ---------- */
const HEAD = { "Friday in Lisbon": ["cal", 1], "Budget": ["tag", 4], "Friday · arrival": ["cal", 1], "People": ["users", 3], "Notifications": ["bell", 5], "Appearance": ["brush", 6], "Your data": ["shield", 2], "Working now": ["sparkle", 1], "Needs you": ["bell", 4], "Done": ["check", 3] };
const withIcons = h => h.replace(/<div class="card-h"><h3>([^<]+)<\/h3>/g, (m, t) => HEAD[t] ? `<div class="card-h"><h3><span class="ic-tile" style="--c:var(--oq-data-${HEAD[t][1]})">${ic(HEAD[t][0])}</span>${t}</h3>` : m);

/* ---------- a frame: the real app at real size, scaled to fit ---------- */
const DIM = { desk: [1280, 800], phone: [390, 844] };
function screenHTML(s, kind) {
  return withIcons( s.nav === false
    ? `${kind === "phone" ? `<div class="cx-status"><span>9:41</span><span>●●● ▮</span></div>` : ""}<div style="flex:1;display:flex;overflow:auto">${s.body()}</div>`
    : `${kind === "phone" ? `<div class="cx-status"><span>9:41</span><span>●●● ▮</span></div>` : ""}<div class="shell"><main class="main">${s.body()}</main></div>${tabbar(tabOn[s.id])}${topnav(navOn[s.id])}${brand}${s.beacon ? (s.beacon === true ? beacon : s.beacon()) : ""}${s.over ? s.over() : ""}`);
}
function frame(s, kind, scale) {
  const [w, h] = DIM[kind], inner = screenHTML(s, kind);
  return `<figure class="fr ${kind}"><figcaption>${themeName()} · ${s.t} · ${kind === "desk" ? "Web 1280" : "Phone 390"}</figcaption>
    <div class="fr-clip" style="width:${Math.round(w * scale)}px;height:${Math.round(h * scale)}px;${kind === "phone" ? `border-radius:${Math.round(46 * scale)}px` : ""}">
    <div class="fr-scale" style="width:${w}px;height:${h}px;transform:scale(${scale})"><div class="${rootCls()}" style="width:${w}px;height:${h}px">${inner}</div></div></div></figure>`;
}
const pairScale = avail => Math.max(.3, Math.min(.72, (avail - 60) / (1280 + 390)));

/* ---------- option A: rail + stage ---------- */
function optA() {
  const s = SCREENS.find(x => x.id === st.screen), groups = [...new Set(SCREENS.map(x => x.g))];
  const avail = Math.min(innerWidth, 1800) - 210 - 44;
  return `<div class="sc-a"><nav class="sc-rail">${groups.map(g => `<h4>${g}</h4>${SCREENS.filter(x => x.g === g).map(x => `<button data-screen="${x.id}" class="${x.id === st.screen ? "on" : ""}">${x.t}</button>`).join("")}`).join("")}</nav>
    <div class="sc-stage"><p class="sc-note"><b>${s.t}.</b> ${s.n}</p><div class="sc-pair">${frame(s, "desk", pairScale(avail))}${frame(s, "phone", pairScale(avail))}</div></div></div>`;
}
/* ---------- option B: storyboard ---------- */
function optB() {
  const sc = pairScale(Math.min(innerWidth, 1800) - 44);
  return `<div class="sc-b"><div class="sc-jump">${SCREENS.map(x => `<a href="#row-${x.id}">${x.t}</a>`).join("")}</div>
    ${SCREENS.map(x => `<section class="sc-row" id="row-${x.id}"><h2>${x.g} · ${x.t}</h2><p>${x.n}</p><div class="sc-pair">${frame(x, "desk", sc)}${frame(x, "phone", sc)}</div></section>`).join("")}</div>`;
}
/* ---------- component table: component | web | phone ---------- */
const ROWS = [
  ["Navigation", "Top nav pill (4 + more) on web; tab bar on phone, labels at rest, icons only while scrolling.", 120, () => `${topnav(0)}${tabbar(0)}<div class="cx-cell" style="padding-top:80px"></div>`],

  ["Buttons", "Filled (one per card), tonal, text, danger, icon. Phone: at least 44 px tall.", 130, () => `<div class="cx-cell"><div class="wrap-row"><button class="btn fill">${ic("check")}Save trip</button><button class="btn tonal">Preview</button><button class="btn text">Cancel</button><button class="btn danger">Delete</button><button class="btn tonal icon" aria-label="Search">${ic("search")}</button></div></div>`],

  ["Select", "A field that opens a themed menu; on phone the list is an action sheet.", 230, () => `<div class="cx-cell"><button class="mo sel" style="font:inherit;color:inherit;text-align:left;border:0"><span class="fl">Kind</span><span class="val">Food</span><span class="chev">${ic("down")}</span></button></div><div class="menu" style="top:76px;left:16px"><div class="lab">Kind</div><button class="mi">${ic("plane")}Travel</button><button class="mi">${ic("bed")}Stay</button><button class="mi">${ic("check")}Food</button></div>`],
  ["Toggles", "Switch, checkbox, radio. Same on both.", 130, () => `<div class="cx-cell"><div class="row-ctl"><button class="switch on" aria-label="a"></button>Remind me</div><div class="row-ctl"><button class="check on" aria-label="b"></button>Split<button class="radio on" aria-label="c"></button>I pay<button class="radio" aria-label="d"></button>Split evenly</div></div>`],
  ["Segmented and tabs", "Sliding thumb on a spring.", 110, () => `<div class="cx-cell"><div><div class="seg2"><i></i><button class="on">Day</button><button>Week</button><button>Month</button></div></div><div class="tabs"><i></i><button class="on">Plans</button><button>Budget</button><button>People</button></div></div>`],
  ["Chips and badges", "Pill = tappable filter; square mono badge = status, always with a word.", 90, () => `<div class="cx-cell"><div class="wrap-row"><button class="chip on">Food</button><button class="chip">Open now</button></div><div class="wrap-row"><span class="badge ok"><i></i>booked</span><span class="badge warn"><i></i>waitlist</span><span class="badge bad"><i></i>cancelled</span></div></div>`],
  ["Table", "Hairline rows, mono numbers. Phone: hide-n columns drop.", 190, () => `<div class="cx-cell"><section class="card"><table class="tbl"><thead><tr><th>Trip</th><th class="hide-n">People</th><th class="num">Budget</th></tr></thead><tbody><tr><td>Lisbon</td><td class="hide-n">4</td><td class="num">€2,000</td></tr><tr><td>Kyoto</td><td class="hide-n">2</td><td class="num">€3,400</td></tr></tbody></table></section></div>`],
  ["Stats", "4 across on web, 2 on phone.", 180, () => `<div class="cx-cell"><section class="card"><div class="stats"><div><b>7</b><span>trips</span></div><div><b>38</b><span>days away</span></div><div><b>5</b><span>countries</span></div><div><b>112</b><span>saved</span></div></div></section></div>`],
  ["Progress and loading", "Bar, indeterminate bar, skeleton rows.", 120, () => `<div class="cx-cell"><div class="prog"><i style="width:64%"></i></div><div class="prog indet"><i></i></div><div class="skel" style="width:70%"></div></div>`],
  ["Empty", "What goes here, and the one action that fills it.", 200, () => `<div class="cx-cell"><section class="card"><div class="empty"><div class="ring">${ic("plane")}</div><b>No trips yet</b>Plan your first trip.<div style="margin-top:10px"><button class="btn fill sm">New trip</button></div></div></section></div>`],
  ["Menu", "Anchored under its button; on phone an action sheet with 44 px rows. Tap Actions: it opens and closes in the Gentle tier.", 230, () => `<div class="cx-cell"><div><button class="btn tonal" data-demo="menu">${ic("down")}Actions</button></div></div><div class="menu" style="top:64px;left:16px"><button class="mi">${ic("edit")}Rename<kbd>R</kbd></button><button class="mi">${ic("share")}Share link</button><hr><button class="mi danger">${ic("trash")}Delete trip</button></div>`],
  ["Tooltip", "Hover hint on web; none on phone (aria-label instead).", 90, () => `<div class="cx-cell" style="padding-top:44px"><div><button class="btn tonal icon" aria-label="Edit">${ic("edit")}</button></div></div><div class="tip" style="top:10px;left:8px">Edit trip<kbd>E</kbd></div>`],
  ["Dialog", "Centred; on phone the actions stack, verb on top.", 260, () => `<div class="scrim"><div class="dialog" style="position:relative"><button class="xbtn" style="position:absolute;top:14px;right:14px" aria-label="Close">${ic("x")}</button><h3 style="padding-right:44px">Delete trip?</h3><p>Kyoto and its 9 plans go for everyone.</p><div class="acts"><button class="btn text">Cancel</button><button class="btn fill">Delete trip</button></div></div></div>`],
  ["Card and coloured icons", "Card with a title icon tile; list rows with 36 px tiles. The colour says what it is, never its state.", 250, () => `<div class="cx-cell"><section class="card"><div class="card-h"><h3><span class="ic-tile" style="--c:var(--oq-data-1)">${ic("cal")}</span>Friday in Lisbon</h3><span class="sp"></span><span class="badge ok"><i></i>booked</span></div><div class="card-b"><div class="wrap-row" style="margin-bottom:6px;gap:14px">${[["plane", 1], ["bed", 3], ["fork", 2], ["heart", 5]].map(r => `<svg class="ico ico-c" viewBox="0 0 24 24" style="--c:var(--oq-data-${r[1]})">${P[r[0]]}</svg>`).join("")}<span class="ink2" style="font-size:.85em">.ico-c</span></div>${[["fork", 2, "Taberna da Rua das Flores"], ["bed", 3, "Memmo Alfama"]].map(r => `<div class="cx-res"><span class="ic-tile lg" style="--c:var(--oq-data-${r[1]})">${ic(r[0])}</span><div><b>${r[2]}</b></div><span></span></div>`).join("")}</div></section></div>`],
  ["Slider", "A solid fill to the value. Same on both.", 80, () => `<div class="cx-cell"><div class="cx-lab">Budget · €80</div><input type="range" class="slider" value="40" style="--v:40%" oninput="this.style.setProperty('--v', this.value + '%')"></div>`],
  ["Avatars", "Initials on a data colour; overlap in a group.", 80, () => `<div class="cx-cell"><div class="wrap-row">${av("MS", 1)}${av("JR", 2)}${av("AK", 3)}${av("TL", 4)}</div></div>`],
  ["Beacon · agent", "The assistant's one presence: live steps, an approval, a receipt. Tap to open; on phone it sits top centre.", 340, () => SCREENS.find(s => s.id === "agent-ask").beacon()],
  ["Bottom sheet", "Rises from the bottom over a scrim (Settle tier), with a grabber. Same markup on web and phone.", 300, () => `<div class="scrim"><div class="sheet"><div class="grab"></div><h3 style="margin:0 0 6px">Share Lisbon</h3><p class="ink2" style="margin:0 0 14px">Anyone with the link can see the plans, not the budget.</p><div class="wrap-row"><button class="btn fill">${ic("copy")}Copy link</button><button class="btn tonal">${ic("mail")}Email</button></div></div></div>`],
  ["Toast", "Bottom centre; on phone above the tab bar. Tap Save: Omxqua.toast shows it and fades it 2.6 s later.", 220, () => `<div class="cx-cell"><div><button class="btn tonal" data-demo="toast">${ic("heart")}Save</button></div></div><div class="toast"><span>Saved to Lisbon</span><button class="btn text sm">Undo</button></div>${tabbar(0)}`],
];
function optT() {
  const cw = Math.min(innerWidth, 1800) - 44 - 190 - 48, s = Math.max(.35, Math.min(.85, (cw - 20) / (680 + 360)));
  const cell = (r, kind) => { const w = kind === "desk" ? 680 : 360, h = r[2];
    return `<div class="fr-clip" style="width:${Math.round(w * s)}px;height:${Math.round(h * s)}px;border-radius:${kind === "phone" ? 18 : 10}px"><div class="fr-scale" style="width:${w}px;height:${h}px;transform:scale(${s})"><div class="${r[4] ? rootCls().replace("oq-top", r[4]) : rootCls()}" style="width:${w}px;height:${h}px">${r[3]()}</div></div></div>`; };
  return `<div class="sc-t"><p class="sc-note"><b>Every part, web and phone.</b> Everything in AGENTS.md §3–4 except the admin-only side island and sidebar. The same markup in a 680 px and a 360 px frame; the width alone decides. ${themeName()} · ${st.mode === "light" ? "Light" : "Night"}.</p>
    <table><thead><tr><th>Component</th><th>Web</th><th>Phone</th></tr></thead><tbody>${ROWS.map(r => `<tr><td><b>${r[0]}</b><span>${r[1]}</span></td><td>${cell(r, "desk")}</td><td>${cell(r, "phone")}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ---------- render ---------- */
function render() {
  $("#themeSeg").innerHTML = THEMES.map(t => `<button data-v="${t[0]}" class="${t[0] === st.theme ? "on" : ""}"><i class="sc-sw" style="background:${t[3]}"></i>${t[1]}</button>`).join("");
  const s = SCREENS.find(x => x.id === st.screen) || SCREENS[1];
  $("#view").innerHTML = st.bare ? `<div class="${rootCls()}" style="width:100vw;height:100vh">${screenHTML(s, st.size)}</div>` : st.opt === "a" ? optA() : st.opt === "b" ? optB() : optT();
  if (!st.bare) history.replaceState(null, "", `?${new URLSearchParams({ opt: st.opt, theme: st.theme, mode: st.mode, screen: st.screen })}`);
  requestAnimationFrame(() => {
    $$(".cx-screen .topnav").forEach(n => Omxqua.layoutTopnav(n, false));
    $$(".cx-screen .seg2, .cx-screen .tabs, .cx-screen .tabbar").forEach(Omxqua.placeThumb);
    $$(".cx-screen .beacon").forEach(b => Omxqua.sizeBeacon(b, false));
  });
}
document.addEventListener("click", e => {
  const seg = e.target.closest(".sc-seg button");
  if (seg) { const k = seg.parentElement.id; if (k === "optSeg") { st.opt = seg.dataset.v; $$("#optSeg button").forEach(b => b.classList.toggle("on", b === seg)); } if (k === "themeSeg") st.theme = seg.dataset.v; if (k === "modeSeg") { st.mode = seg.dataset.v; $$("#modeSeg button").forEach(b => b.classList.toggle("on", b === seg)); } render(); return; }
  const sb = e.target.closest("[data-screen]"); if (sb) { st.screen = sb.dataset.screen; render(); return; }
  /* inside frames: tabs, segments, chips and toggles respond like the real app */
  const g = e.target.closest(".cx-screen .seg2 button, .cx-screen .tabs button, .cx-screen .tabbar button"); if (g) { $$("button", g.parentElement).forEach(b => b.classList.toggle("on", b === g)); Omxqua.placeThumb(g.parentElement); }
  const c = e.target.closest(".cx-screen .chip, .cx-screen .switch, .cx-screen .check"); if (c) c.classList.toggle("on");
  const op = e.target.closest(".cx-screen .ag-opt, .cx-screen .cx-pick"); if (op) { $$(op.classList.contains("ag-opt") ? ".ag-opt" : ".cx-pick", op.parentElement).forEach(o => { o.classList.toggle("on", o === op); const r = o.querySelector(".radio"); if (r) r.classList.toggle("on", o === op); }); const bb = op.parentElement.querySelector("[data-book]"); if (bb && op.dataset.opt) bb.textContent = op.dataset.opt; }
  const dm = e.target.closest("[data-demo]"); if (dm) { const root = dm.closest(".cx-screen");
    if (dm.dataset.demo === "menu") { const m = $(".menu", root); m.hidden ? Omxqua.gentleIn(m) : Omxqua.gentleOut(m); }
    if (dm.dataset.demo === "toast") { const t = $(".toast", root); Omxqua.toast(t, "Saved to Lisbon", $("span", t)); } }
  const bk = e.target.closest(".cx-screen .beacon"); if (bk) { bk.classList.toggle("open", !e.target.closest(".x")); Omxqua.sizeBeacon(bk, true); }
});
/* ---------- live bits in the agent concepts: steps advance, voice levels move, the Undo counts down ---------- */
let tick = 0;
setInterval(() => {
  tick++;
  $$(".cx-screen .ag-lv i").forEach(i => i.style.height = (20 + Math.random() * 80) + "%");
  if (!(tick % 8)) $$(".cx-screen [data-count]").forEach(c => { const n = (+c.dataset.count + 10) % 11; c.dataset.count = n; c.textContent = `Undo 0:${String(n).padStart(2, "0")}`; });
  if (tick % 15) return;
  $$(".cx-screen [data-steps]").forEach(ul => { const li = $$("li", ul), k = 2 + (tick / 15) % (li.length - 1);
    li.forEach((l, i) => { l.querySelector(".d").className = "d" + (i < k ? " ok" : i === k ? " run" : ""); });
    const bar = ul.parentElement.querySelector(".bar2 i"); if (bar) bar.style.width = Math.round(100 * (k + .5) / li.length) + "%"; });
}, 120);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
/* ?bare=1 renders one screen full size with no chrome, for iframes (home page phones): &screen= &theme= &mode= &size=phone|desk */
const q = new URLSearchParams(location.search); for (const k of ["opt", "theme", "mode", "screen", "size"]) if (q.get(k)) st[k] = q.get(k);
if (!THEMES.some(t => t[0] === st.theme)) st.theme = "azulejo";
st.bare = q.has("bare"); st.size = st.size === "desk" ? "desk" : "phone"; if (st.bare) document.body.classList.add("bare");
$$("#optSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === st.opt)); $$("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === st.mode));
render();
})();
</script>
