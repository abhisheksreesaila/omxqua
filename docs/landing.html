<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omxqua · landing layer</title>
<link rel="stylesheet" href="../src/fonts.css">
<style>

/* =====================================================================
   LANDING LAYER: same families, fonts and colours as the apps, turned up.
   The app is quiet and dense; the landing page is loud, huge and moves with the scroll.
   ===================================================================== */
:root { --ease: cubic-bezier(.2, 0, 0, 1); }
.L { --display: "Geist", system-ui, sans-serif; --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  --hero: clamp(64px, 12vw, 168px); --h2: clamp(40px, 6.4vw, 88px); --lede: clamp(22px, 2.4vw, 30px); --read: clamp(28px, 3.6vw, 48px); --body: 19px;
  font-family: var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
/* concept A · Statement (Developer · Graphite, night) */
.L.a { --bg: #000; --bg2: #0d0d0f; --ink: #f5f5f7; --ink2: #86868b; --line: #222225; --accent: #f5f5f7; --on: #000; --hi: #3ccf6e; --hw: 800; }
/* concept B · Editorial (Travel · Azulejo, paper) */
.L.b { --bg: #f6f1e7; --bg2: #efe7d8; --ink: #1f2433; --ink2: #6b6a64; --line: #e2d8c6; --accent: #1f4f8f; --on: #fff; --hi: #a9471f; --display: "Fraunces", Georgia, serif; --hw: 600; }
/* concept C · Bento (Kids · Sticker, light) */
.L.c { --bg: #f7f7f5; --bg2: #ffffff; --ink: #1f2a30; --ink2: #5f6b73; --line: #e3e6e8; --accent: #1971c2; --on: #fff; --hi: #f08c00; --display: "Nunito", system-ui, sans-serif; --sans: "Nunito", system-ui, sans-serif; --hw: 900; }

html, body { margin: 0; }
body { background: #000; }
.switch-bar { position: fixed; z-index: 200; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 3px; padding: 4px; border-radius: 999px; background: rgba(20,20,22,.92); box-shadow: 0 8px 30px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.08); font: 500 12.5px "Geist", system-ui; }
.switch-bar button { border: 0; background: none; color: #a1a1aa; padding: 8px 14px; border-radius: 999px; cursor: pointer; font: inherit; }
.switch-bar button.on { background: #f5f5f7; color: #000; }
.switch-bar span { color: #6b6b70; padding: 8px 10px 8px 12px; }

.L { --section: 140px; }
.L section { padding: var(--section) 24px; position: relative; }
.wrap { max-width: 1120px; margin: 0 auto; }
.center { text-align: center; }
.eyebrow { font: 600 13px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--hi); }
.L h1 { font: var(--hw) var(--hero)/.92 var(--display); letter-spacing: -.055em; margin: 18px 0 0; }
.L h2 { font: var(--hw) var(--h2)/1 var(--display); letter-spacing: -.045em; margin: 14px 0 0; }
.two { color: var(--ink2); }  /* two-tone headline: the claim in ink, its continuation quiet */
.lede { font: 500 var(--lede)/1.3 var(--sans); letter-spacing: -.015em; color: var(--ink2); margin: 22px auto 0; max-width: 760px; }
.lede b { color: var(--ink); font-weight: 600; }
.ctas { display: flex; gap: 14px; justify-content: center; align-items: center; margin-top: 36px; flex-wrap: wrap; }
.cta { height: 50px; padding: 0 26px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on); font: 600 17px var(--sans); cursor: pointer; transition: transform 300ms cubic-bezier(.2,.9,.3,1.15); }
.more { color: var(--accent); font: 500 17px var(--sans); text-decoration: none; }
.more::after { content: " ›"; }
.L.a .more { color: #2997ff; }

/* top islands, same shape as the app shell, lighter */
.lnav { position: sticky; top: 0; z-index: 50; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 20px; background: var(--bg); box-shadow: 0 1px 0 var(--line); }
.lnav .brand { font: 700 17px var(--display); letter-spacing: -.02em; display: flex; align-items: center; gap: 9px; }
.lnav .mark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.lnav .mark text { fill: currentColor; stroke: currentColor; stroke-width: .8; stroke-dasharray: 120; stroke-dashoffset: 0; paint-order: stroke; }
.lnav .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--on); display: grid; place-items: center; font: 700 12px var(--mono); }
.lnav .pill { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: color-mix(in srgb, var(--bg2) 92%, transparent); box-shadow: 0 0 0 1px var(--line); }
.lnav .pill a { color: var(--ink2); text-decoration: none; font: 500 13.5px var(--sans); padding: 7px 14px; border-radius: 999px; }
.lnav .pill a:hover { color: var(--ink); }
.lnav .right { justify-self: end; }
.lnav .cta { height: 34px; padding: 0 16px; font-size: 13.5px; }

/* motion: words rise in once on load; elements reveal as they enter (scroll-driven, IO fallback) */
.rise > span { display: inline-block; opacity: 0; transform: translateY(.35em); animation: rise .9s var(--ease) forwards; }
@keyframes rise { to { opacity: 1; transform: none; } }
.rv { opacity: 0; transform: translateY(28px); transition: opacity .9s var(--ease), transform .9s var(--ease); }
.rv.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .rise > span, .rv { opacity: 1 !important; transform: none !important; animation: none !important; transition: none !important; } }

/* the product unfolds: a live app frame scales and squares as you scroll into it */
.unfold { height: 170vh; padding: 0 !important; }
.unfold .stick { position: sticky; top: 8vh; height: 84vh; display: grid; place-items: center; }
.unfold .frame { width: min(1180px, 92vw); height: 76vh; border-radius: 40px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.45), 0 0 0 1px var(--line); transform-origin: 50% 40%; background: var(--bg2); will-change: transform; }
.unfold iframe { width: 100%; height: 100%; border: 0; display: block; }
.unfold .cap { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font: 13px var(--mono); color: var(--ink2); }

/* read-along: a paragraph that lights up word by word as you scroll */
.read p { font: 600 var(--read)/1.22 var(--sans); letter-spacing: -.03em; max-width: 980px; margin: 0 auto; }
.read p span { color: color-mix(in srgb, var(--ink) 22%, var(--bg)); transition: color .25s; }
.read p span.lit { color: var(--ink); }

/* numbers that count up when they arrive */
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 70px; }
.nums div { border-top: 1px solid var(--line); padding-top: 22px; }
.nums b { display: block; font: var(--hw) clamp(44px, 6vw, 84px)/1 var(--display); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.nums span { color: var(--ink2); font-size: 17px; }

/* stacked statements */
.stack .line { font: var(--hw) clamp(36px, 6vw, 80px)/1.04 var(--display); letter-spacing: -.045em; }
.stack .line:nth-child(2) { color: var(--ink2); } .stack .line:nth-child(3) { color: color-mix(in srgb, var(--ink2) 60%, var(--bg)); }

/* B · editorial */
.L.b h1 { font-style: italic; font-weight: 500; letter-spacing: -.035em; }
.L.b h2 { font-weight: 500; letter-spacing: -.03em; }
.chapters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 70px; }
.chap .n { font: 300 120px/1 var(--display); color: var(--hi); letter-spacing: -.04em; }
.chap h3 { font: 600 30px/1.1 var(--display); margin: 10px 0 8px; letter-spacing: -.02em; }
.chap p { color: var(--ink2); font-size: 18px; line-height: 1.5; margin: 0; }
.plate { border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); margin-top: 22px; height: 210px; position: relative; }
.plate iframe { width: 200%; height: 200%; transform: scale(.5); transform-origin: 0 0; border: 0; pointer-events: none; }
.quote { font: italic 400 clamp(32px, 4.4vw, 58px)/1.15 var(--display); letter-spacing: -.02em; max-width: 900px; margin: 0 auto; }
.quote cite { display: block; font: 500 13px var(--mono); font-style: normal; color: var(--ink2); margin-top: 22px; letter-spacing: .08em; text-transform: uppercase; }
.rule { height: 1px; background: var(--line); margin: 0 auto; max-width: 1120px; }

/* C · bento with live components */
.bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 230px; gap: 16px; margin-top: 60px; }
.tile { background: var(--bg2); border-radius: 28px; padding: 26px; position: relative; overflow: hidden; box-shadow: inset 0 0 0 2px var(--line), 0 5px 0 var(--line); display: flex; flex-direction: column; }
.tile h3 { font: 900 28px/1.05 var(--display); margin: 0; letter-spacing: -.02em; }
.tile p { color: var(--ink2); margin: 8px 0 0; font-size: 16px; }
.tile.w2 { grid-column: span 2; } .tile.h2 { grid-row: span 2; }
.tile.blue { background: #1971c2; color: #fff; box-shadow: 0 5px 0 #12569a; } .tile.blue p { color: #dbeafe; }
.tile .live { margin-top: auto; }
.beacon-demo { display: inline-flex; align-items: center; gap: 10px; background: #0b0b0d; color: #f4f4f5; border-radius: 999px; padding: 10px 16px; font: 700 15px var(--sans); box-shadow: 0 10px 24px rgba(0,0,0,.3); }
.beacon-demo i { width: 9px; height: 9px; border-radius: 50%; background: #ffd43b; box-shadow: 0 0 0 5px rgba(255,212,59,.25); }
.beacon-demo span { font: 500 14px var(--mono); color: #a1a1aa; }
.qt { display: flex; gap: 12px; }
.qt button { flex: 1; border: 0; border-radius: 18px; padding: 14px; background: #fff; box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line); font: 800 15px var(--sans); color: var(--ink); cursor: pointer; transition: transform 160ms; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.qt button em { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 18px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.qt button.done { background: #ebfbee; box-shadow: inset 0 0 0 2px #8ce99a, 0 4px 0 #8ce99a; }
.qt button:active { box-shadow: inset 0 0 0 2px var(--line); }
.qt button, .L.c .cta { --oq-press: ledge; }
.bars { display: flex; gap: 8px; align-items: flex-end; height: 120px; }
.bars i { flex: 1; border-radius: 10px; background: #1971c2; transform-origin: bottom; transform: scaleY(0); transition: transform .9s var(--ease); }
.in .bars i { transform: scaleY(1); }
.big-star { font: 1000 120px/1 var(--display); color: var(--hi); letter-spacing: -.05em; }

@media (max-width: 800px) { .nums, .chapters { grid-template-columns: 1fr; } .bento { grid-template-columns: 1fr 1fr; } .tile.w2 { grid-column: span 2; } .lnav .pill { display: none; } }
footer.f { padding: 60px 24px 120px; color: var(--ink2); font: 13px var(--mono); text-align: center; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="switch-bar" id="sw"><span>Landing</span><button class="on" data-c="a">A · Statement</button><button data-c="b">B · Editorial</button><button data-c="c">C · Bento</button></div>
<div id="page"></div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const words = (t, step = 70, d0 = 0) => t.split(" ").map((w, i) => `<span style="animation-delay:${d0 + i * step}ms">${w}</span>`).join(" ");
const read = t => t.split(" ").map(w => `<span>${w}</span>`).join(" ");

const A = () => `<div class="L a">
  <nav class="lnav"><div class="brand"><span class="mark">ox</span>omxcore</div><div class="pill"><a href="#">Overview</a><a href="#">Speed</a><a href="#">Agents</a><a href="#">Docs</a></div><div class="right"><button class="cta">Get the alpha</button></div></nav>
  <section class="center" style="padding-top:110px"><div class="wrap">
    <div class="eyebrow rise"><span>Introducing</span></div>
    <h1 class="rise">${words("omxcore", 0, 120)}</h1>
    <p class="lede rise">${words("One engine.", 60, 380)} ${words("Every screen, every agent.", 60, 560).replace(/<span /g, '<span class="two" ')}</p>
    <div class="ctas rise"><span style="animation-delay:900ms"><button class="cta">Get the alpha</button></span><span style="animation-delay:980ms"><a class="more" href="#">Read the story</a></span></div>
  </div></section>
  <section class="unfold" data-unfold><div class="stick"><div class="frame"><iframe src="kit-v1.html?fam=dev&shell=top&theme=night&bare=1" loading="lazy" title="omxcore app"></iframe></div><div class="cap">the real app, live · scroll</div></div></section>
  <section class="read" data-read><div class="wrap center"><p>${read("Write your app once. It runs natively on Linux, the web, Android, Mac and iPhone, with the GPU in the same language. And any agent can use it, with no API to build.")}</p></div></section>
  <section><div class="wrap">
    <div class="eyebrow rv">Speed</div><h2 class="rv">A million rows. <span class="two">Under a millisecond.</span></h2>
    <div class="nums"><div class="rv"><b data-count="0.3" data-dec="1">0</b><span>ms to recompute a report</span></div><div class="rv"><b data-count="1000000">0</b><span>rows, in the app's own process</span></div><div class="rv"><b data-count="4">0</b><span>platforms from one file</span></div></div>
  </div></section>
  <section class="stack"><div class="wrap"><div class="line rv">A native app.</div><div class="line rv">A GPU engine.</div><div class="line rv">An agent's toolbox.</div>
    <p class="lede rv" style="margin-left:0">These aren't three things. <b>It's one program.</b></p></div></section>
  <section class="center"><div class="wrap"><h2 class="rv">Try it today.</h2><div class="ctas rv"><button class="cta">Get the alpha</button><a class="more" href="#">Read the docs</a></div></div></section>
  <footer class="f">Geist display 800 · tracking −5.5% · two-tone headings · motion on scroll, nothing on idle</footer></div>`;

const B = () => `<div class="L b">
  <nav class="lnav"><div class="brand"><span class="mark" style="font-family:var(--display);font-style:italic">c</span>Contoso</div><div class="pill"><a href="#">Plan</a><a href="#">Go</a><a href="#">Remember</a></div><div class="right"><button class="cta">Start a trip</button></div></nav>
  <section class="center" style="padding-top:120px"><div class="wrap">
    <div class="eyebrow rise"><span>A travel planner for two</span></div>
    <h1 class="rise">${words("Lisbon, in five days.", 90, 120)}</h1>
    <p class="lede rise">${words("Every flight, table and tram on one quiet timeline.", 40, 600)}</p>
    <div class="ctas rise"><span style="animation-delay:1000ms"><button class="cta">Start a trip</button></span><span style="animation-delay:1080ms"><a class="more" href="#">See a sample trip</a></span></div>
  </div></section>
  <div class="rule"></div>
  <section><div class="wrap"><div class="chapters">
    <div class="chap rv"><div class="n">01</div><h3>Plan</h3><p>Drop in bookings; they land on the right day, in local time.</p><div class="plate"><iframe src="kit-v1.html?fam=travel&skin=azulejo&theme=light&shell=top&bare=1" loading="lazy" title=""></iframe></div></div>
    <div class="chap rv"><div class="n">02</div><h3>Go</h3><p>The Beacon counts down to boarding and knows your gate.</p><div class="plate" style="display:grid;place-items:center;background:var(--bg2)"><div class="beacon-demo" style="font-family:Geist"><i style="background:#8fb4ea;box-shadow:0 0 0 5px rgba(143,180,234,.25)"></i>TAP 1352<span>boards 42 min</span></div></div></div>
    <div class="chap rv"><div class="n">03</div><h3>Remember</h3><p>Every day keeps its places, photos and what it cost.</p><div class="plate" style="background:var(--bg2);display:flex;align-items:flex-end;gap:8px;padding:20px">${[60, 85, 40, 70, 95].map((h, i) => `<i style="flex:1;height:${h}%;border-radius:4px;background:${["#56662a", "#a9471f", "#21606a", "#6d3f6b", "#1f4f8f"][i]}"></i>`).join("")}</div></div>
  </div></div></section>
  <section class="read" data-read style="background:var(--bg2)"><div class="wrap center"><p style="font-family:var(--display);font-weight:500;letter-spacing:-.02em">${read("Days are never colour-coded. The things you do are: a flight, a stay, a meal, a view. So a glance at a day tells you what it holds.")}</p></div></section>
  <section class="center"><div class="wrap"><blockquote class="quote rv">“We stopped sending each other screenshots of bookings.”<cite>Two travellers · Lisbon, October</cite></blockquote></div></section>
  <section class="center"><div class="wrap"><h2 class="rv">Where to next?</h2><div class="ctas rv"><button class="cta">Start a trip</button><a class="more" href="#">See a sample trip</a></div></div></section>
  <footer class="f">Fraunces display (italic hero, 300 numerals) · Geist body · paper and tile blue · chapters, plates, a pull quote</footer></div>`;

const C = () => `<div class="L c">
  <nav class="lnav"><div class="brand"><span class="mark" style="border-radius:50%">★</span>questly</div><div class="pill"><a href="#">How it works</a><a href="#">Parents</a><a href="#">Rewards</a></div><div class="right"><button class="cta" style="box-shadow:0 4px 0 #12569a">Try it free</button></div></nav>
  <section class="center" style="padding-top:110px"><div class="wrap">
    <div class="eyebrow rise"><span>For kids 6 to 11</span></div>
    <h1 class="rise">${words("Chores, but make them quests.", 80, 120)}</h1>
    <p class="lede rise">${words("Kids earn stars. Parents get peace. Everyone gets to the park.", 40, 650)}</p>
    <div class="ctas rise"><span style="animation-delay:1000ms"><button class="cta" style="box-shadow:0 4px 0 #12569a">Try it free</button></span><span style="animation-delay:1080ms"><a class="more" href="#">How it works</a></span></div>
  </div></section>
  <section style="padding-top:20px"><div class="wrap"><div class="bento">
    <div class="tile w2 h2 rv blue"><h3>A quest for everything</h3><p>Reading, plants, piano, a bike ride. Tap when it's done.</p>
      <div class="live qt"><button data-q class="done"><em style="background:#f08c00"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zM20 19v2H6"/></svg></em>Read 20 min</button><button data-q><em style="background:#2b8a3e"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10M12 20v-8M12 12c0-4-3-6-7-6 0 4 3 6 7 6zM12 10c0-3 2-5 6-5 0 3-2 5-6 5z"/></svg></em>Feed plants</button><button data-q><em style="background:#7048e8"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></em>Piano</button></div></div>
    <div class="tile rv"><h3>Live timer</h3><p>On the lock screen, too.</p><div class="live"><div class="beacon-demo" style="font-family:Nunito"><i></i>Reading<span data-timer>12:04</span></div></div></div>
    <div class="tile rv" style="align-items:flex-start"><div class="big-star" data-count="12">0</div><p style="margin-top:auto">stars this week</p></div>
    <div class="tile w2 rv"><h3>Best week yet</h3><div class="live bars">${[60, 85, 40, 100, 70, 20, 8].map((h, i) => `<i style="height:${h}%;transition-delay:${i * 70}ms"></i>`).join("")}</div></div>
  </div></div></section>
  <section class="read" data-read><div class="wrap center"><p style="font-family:Nunito;font-weight:900">${read("No ads. No streaks that make kids anxious. Stars turn into real things: a zoo trip, a later bedtime, pancakes on Saturday.")}</p></div></section>
  <section class="center"><div class="wrap"><h2 class="rv">Ready for quest one?</h2><div class="ctas rv"><button class="cta" style="box-shadow:0 4px 0 #12569a">Start quest one</button><a class="more" href="#">For parents</a></div></div></section>
  <footer class="f">Nunito 900 display · bento tiles hold the real app components · chunky ledge buttons · bars grow in once</footer></div>`;

let io, raf;
function render(c) {
  $("#page").innerHTML = { a: A, b: B, c: C }[c]();
  window.scrollTo(0, 0);
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); count(e.target); io.unobserve(e.target); } }), { threshold: .25 });
  $$(".rv, .tile").forEach(el => io.observe(el));
  if (reduce) $$(".rv").forEach(el => el.classList.add("in"));
}
function count(el) {
  $$("[data-count]", el).concat(el.matches("[data-count]") ? [el] : []).forEach(b => {
    const to = +b.dataset.count, dec = +(b.dataset.dec || 0), t0 = performance.now(), dur = reduce ? 0 : 1400;
    const step = t => { const p = dur ? Math.min(1, (t - t0) / dur) : 1, e = 1 - Math.pow(1 - p, 3), v = to * e; b.textContent = dec ? v.toFixed(dec) : Math.round(v).toLocaleString(); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
/* scroll scenes: the unfold frame and the read-along paragraph */
function onScroll() {
  const vh = innerHeight;
  $$("[data-unfold]").forEach(s => { const r = s.getBoundingClientRect(), p = Math.min(1, Math.max(0, (vh - r.top) / (r.height))), f = $(".frame", s);
    const k = Math.min(1, p * 1.6); f.style.transform = `scale(${0.82 + 0.18 * k})`; f.style.borderRadius = `${40 - 26 * k}px`; });
  $$("[data-read]").forEach(s => { const r = s.getBoundingClientRect(), p = Math.min(1, Math.max(0, (vh * .8 - r.top) / (r.height * .9))), sp = $$("p span", s), n = Math.round(p * sp.length);
    sp.forEach((x, i) => x.classList.toggle("lit", reduce || i < n)); });
}
addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(onScroll); }, { passive: true });
document.addEventListener("click", e => { const q = e.target.closest("[data-q]"); if (q) q.classList.toggle("done"); });
